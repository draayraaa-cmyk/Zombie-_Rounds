name: Build Android APK
on: [push]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Create Isolated Build Space
        run: |
          # 1. Create a fresh temporary staging directory
          mkdir staging
          
          # 2. Copy only your regular code files and folders into it
          # (This completely ignores hidden system files and virtual device endpoints)
          cp -r [a-zA-Z0-9]* staging/ 2>/dev/null || true
          
          # 3. Enter the clean folder and create the .love file
          cd staging
          zip -r ../game.love .
          
          # 4. Clean up the temporary folder
          cd ..
          rm -rf staging

      - name: Build Android APK
        uses: love-actions/love-actions-android@v2
        with:
          app-name: "My Game"
          bundle-id: "com.love2d.mygame"
          love-package: "game.love"

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: "**/*.apk"
