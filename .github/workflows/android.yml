name: Build Android APK
on: [push]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Bundle into .love
        run: |
          # The -y flag ensures symbolic links are preserved correctly without creating special socket files
          zip -ry game.love . -x "*.git*" ".github*" "game.love"

      - name: Build Android APK
        uses: love-actions/love-actions-android@v2
        with:
          app-name: "My Game"
          bundle-id: "com.love2d.mygame"
          love-package: "game.love"

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: "**/*.apk"
